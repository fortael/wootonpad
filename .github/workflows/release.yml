name: Release (Mac + Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # A stuck test process must not hold a release open indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the single source of truth for the version. electron-builder
      # only ever reads package.json, so the tag is written into this throwaway
      # checkout before packaging — nothing is committed, and package.json on
      # main never has to be bumped by hand.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Packaging version $VERSION"

      - name: Bundle assets
        run: npm run bundle:codemirror && npm run bundle:vue

      - name: Build Mac app
        run: npx electron-builder --mac --publish never --config.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts to GitHub Release
        run: gh release upload "${{ github.ref_name }}" dist/WootonPad-*-arm64.dmg dist/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: test
    runs-on: windows-latest
    # Packaging plus upload runs well under the cap; this is the backstop for a
    # step that never returns.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same as in build-mac: the version comes from the tag, not package.json.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Packaging version $VERSION"

      - name: Bundle assets
        run: npm run bundle:codemirror && npm run bundle:vue

      # One NSIS installer covering both x64 and arm64 — the arch list comes from
      # build.win.target[].arch in package.json. Both archs of better-sqlite3 and
      # node-pty resolve from prebuilds, so no ARM64 MSVC toolset is involved.
      - name: Build Windows app
        run: npx electron-builder --win --publish never

      # The default NSIS artifact name contains a space ("WootonPad Setup
      # <version>.exe"), so a glob is safer than naming the file. latest.yml is
      # the auto-update metadata electron-builder emits alongside it.
      - name: Upload artifacts to GitHub Release
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem dist/*.exe, dist/latest.yml | ForEach-Object FullName)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
